<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Seu pedido | Itajaó Cafés Especiais</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;background:#FEECD8;color:#6F4E37;font-family:'Montserrat',Arial,sans-serif;font-variant-numeric:lining-nums tabular-nums}.top{height:34px;background:#3D2B1F}.page{min-height:calc(100vh - 34px);display:grid;place-items:center;padding:28px}.card{width:min(600px,100%);background:#fff;border:1px solid rgba(111,78,55,.1);border-radius:18px;padding:clamp(24px,5vw,46px);text-align:center;box-shadow:0 22px 70px rgba(61,43,31,.09)}.logo{width:160px;max-width:55%;height:auto;margin-bottom:24px}.icon{width:60px;height:60px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:#FEECD8;font-size:1.5rem}h1{font-size:clamp(1.5rem,4vw,2.25rem);color:#3D2B1F;margin:0 0 12px}.copy{font-size:.8rem;line-height:1.7;color:#8C6A50}.order{display:none;margin:22px 0;padding:15px;background:#fff8f0;border-radius:12px;text-align:left;font-size:.7rem;line-height:1.8}.order.show{display:block}.order div{display:flex;justify-content:space-between;gap:16px}.order strong{color:#3D2B1F}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border-radius:999px;background:#6F4E37;color:#FED8B1;text-decoration:none;text-transform:uppercase;font-size:.64rem;letter-spacing:.1em;font-weight:800;margin-top:20px}.support{font-size:.61rem;color:#9a8272;margin-top:16px}.support a{color:#6F4E37;font-weight:700}</style>
</head>
<body><div class="top"></div><main class="page"><section class="card"><img class="logo" src="teste4.png" alt="Itajaó Cafés Especiais"><div class="icon" id="icon">☕</div><h1 id="title">Consultando seu pedido...</h1><p class="copy" id="copy">Só um instante enquanto confirmamos a situação diretamente no nosso sistema.</p><div class="order" id="details"><div><span>Pedido</span><strong id="orderId">—</strong></div><div><span>Pagamento</span><strong id="payment">—</strong></div><div><span>Total</span><strong id="total">—</strong></div></div><a class="btn" href="index.html">Voltar para a Itajaó</a><p class="support">Precisa de ajuda? <a href="https://wa.me/5535998087168" target="_blank" rel="noopener">Fale com a gente no WhatsApp.</a></p></section></main><script src="store-config.js"></script><script>
(function(){'use strict';const cfg=window.ITAJAO_STORE_CONFIG||{},params=new URLSearchParams(location.search),id=params.get('order'),token=params.get('token');const $=x=>document.getElementById(x),money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0);let attempts=0,timer;
function paint(data){$('details').classList.add('show');$('orderId').textContent=data.orderNumber||String(data.id||'').slice(0,8).toUpperCase();$('payment').textContent=data.paymentStatusLabel||'Aguardando';$('total').textContent=money(data.total);if(data.status==='paid'||data.status==='processing'||data.status==='fulfilled'){$('icon').textContent='✓';$('title').textContent='Pagamento confirmado!';$('copy').textContent='Recebemos seu pedido. Agora vamos preparar o seu Café Itajaó para envio.';if(timer)clearInterval(timer)}else if(data.status==='payment_failed'||data.status==='cancelled'||data.status==='refunded'){$('icon').textContent='!';$('title').textContent='O pagamento não foi concluído.';$('copy').textContent='Você pode tentar novamente ou falar com a gente se precisar de ajuda.';if(timer)clearInterval(timer)}else{$('icon').textContent='⌛';$('title').textContent='Pagamento em processamento.';$('copy').textContent='Assim que o Mercado Pago confirmar, esta página será atualizada automaticamente.'}}
async function check(){if(!id||!token){$('title').textContent='Pedido não identificado.';$('copy').textContent='Volte para a loja ou fale com a gente para localizar sua compra.';return}try{const headers={'Content-Type':'application/json'};if(cfg.supabasePublishableKey){headers.apikey=cfg.supabasePublishableKey;headers.Authorization='Bearer '+cfg.supabasePublishableKey}const response=await fetch(cfg.functionsBaseUrl+'/order-status',{method:'POST',headers,body:JSON.stringify({id,token})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Falha ao consultar');paint(data)}catch(_){if(attempts>2){$('title').textContent='Ainda estamos confirmando seu pedido.';$('copy').textContent='A confirmação pode levar alguns instantes. Se você já pagou, não faça outro pagamento.'}}attempts++;if(attempts>=12&&timer)clearInterval(timer)}check();timer=setInterval(check,5000)})();
</script></body></html>
